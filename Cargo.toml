[package]
name = "pscan"
version = "2.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "High-performance TCP/UDP port scanner with host discovery and service fingerprinting"
repository = "https://github.com/Moxin1044/Pscan"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
ipnet = "2.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_update = { version = "1.0.0-rc.6", default-features = false, features = ["github", "reqwest", "rustls", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "checksums"] }
surge-ping = "0.9"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
